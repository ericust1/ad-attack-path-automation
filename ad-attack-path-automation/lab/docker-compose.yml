version: "3.9"

services:
  neo4j:
    image: neo4j:5.15
    container_name: ad-lab-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    networks:
      - ad-lab
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  bloodhound:
    image: bloodhoundce/bloodhound:latest
    container_name: ad-lab-bloodhound
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BH_DISABLE_AUTH: "true"
    volumes:
      - bloodhound_data:/data
    networks:
      - ad-lab
    depends_on:
      neo4j:
        condition: service_healthy

  ad-simulator:
    build:
      context: ..
      dockerfile: Dockerfile.simulator
    container_name: ad-lab-simulator
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./output:/app/output
    networks:
      - ad-lab
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  bloodhound_data:
    driver: local

networks:
  ad-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
