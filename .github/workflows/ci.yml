name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Python tests
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
      - name: Lint with flake8
        run: flake8 src/ tests/ --max-line-length=100 --statistics

  powershell-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts
        run: |
          pwsh -Command "Get-ChildItem -Path src/modules/powershell_scripts -Filter *.ps1 -Recurse | ForEach-Object { Write-Host 'Validating:' \$_.FullName; \$errors = \$null; [System.Management.Automation.Language.Parser]::ParseFile(\$_.FullName, [ref]\$null, [ref]\$errors); if (\$errors.Count -gt 0) { Write-Error 'Parse errors found:'; \$errors | ForEach-Object { Write-Error \$_.Message }; exit 1 } else { Write-Host 'Valid' } }"
